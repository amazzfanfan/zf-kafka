services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=60]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  relay:
    build: .
    environment:
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@postgres:5432/relay?sslmode=disable
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Set RELAY_ADMIN_TOKEN in .env}
      RELAY_MASTER_KEY: ${RELAY_MASTER_KEY:?Set RELAY_MASTER_KEY in .env}
      APP_PREFIX: ${APP_PREFIX:-relay}
      RELAY_ENABLE_TRUSTED_SCRIPTS: ${RELAY_ENABLE_TRUSTED_SCRIPTS:-false}
      RELAY_STORAGE_BUDGET_BYTES: '10737418240'
      GOMEMLIMIT: 192MiB
    depends_on:
      postgres: {condition: service_healthy}
    ports: ['127.0.0.1:8080:8080']
    stop_grace_period: 40s
    restart: unless-stopped
    mem_limit: 512m
volumes:
  postgres:
