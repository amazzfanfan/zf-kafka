name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U relay" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: '26', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm run build && npm test && npm audit
        working-directory: web
      - run: go vet ./... && go test -race -count=1 -timeout=180s ./...
        env:
          TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
